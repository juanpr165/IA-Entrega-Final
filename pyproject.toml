[project]
name = "ia-entrega-final"
version = "1.0.0"
description = "Sistema Intelligence: RAG, supervisor LangGraph, FastAPI y trazabilidad."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3", "redis>=5.2,<7", "langgraph>=0.2,<2",
  "langgraph-checkpoint-redis>=0.1,<1", "langchain-groq>=0.2,<2",
  "langchain-core>=0.3,<2", "httpx>=0.28,<1", "langsmith>=0.2,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]